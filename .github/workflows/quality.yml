name: quality

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.12.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:coverage

  macos-package:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.12.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:mac
      - name: Verify unsigned app and archive it
        shell: bash
        run: |
          shopt -s nullglob
          apps=(apps/desktop/out/FocusLit-darwin-*/FocusLit.app)
          test "${#apps[@]}" -eq 1
          test -f "${apps[0]}/Contents/Info.plist"
          ditto -c -k --sequesterRsrc --keepParent "${apps[0]}" apps/desktop/out/FocusLit-unsigned-macos.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: FocusLit-unsigned-macos
          path: apps/desktop/out/FocusLit-unsigned-macos.zip
          retention-days: 3
          if-no-files-found: error

  required-checks:
    if: always()
    needs: [quality, macos-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail if any required job failed or skipped
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          MACOS_RESULT: ${{ needs.macos-package.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$MACOS_RESULT" = success
